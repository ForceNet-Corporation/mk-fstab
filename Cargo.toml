[package]
name = "mk-fstab"
version = "0.1.0"
edition = "2021"
description = "A helper for generating /etc/fstab entries"

[[bin]]
name = "mk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
strip = true